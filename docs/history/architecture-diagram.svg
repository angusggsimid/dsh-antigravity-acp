<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#131c2e" stroke-width="1"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="localCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090e1a" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="tunnelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f0d26" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="vpsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#061917" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="googleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>

    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>

    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#090d16"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title Banner -->
  <g transform="translate(60, 42)">
    <circle cx="16" cy="16" r="8" fill="#38bdf8" filter="url(#glow-cyan)"/>
    <text x="36" y="23" font-size="24" font-weight="700" fill="url(#headerGrad)" letter-spacing="0.5">DSH × Google Antigravity (ACP) 端到端架构全景图</text>
    <text x="36" y="46" font-size="13" fill="#64748b">DeepSeek Harness 本地宿主环境 ↔ SSH 加密隧道 / 反向 MCP 穿透 ↔ 远端官方 ACP ↔ Gemini 3.8 Flash</text>
  </g>

  <!-- Legend -->
  <g transform="translate(900, 46)">
    <rect x="0" y="0" width="320" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <!-- Line 1: Blue -->
    <line x1="16" y1="17" x2="36" y2="17" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,2"/>
    <text x="44" y="21" font-size="11" fill="#94a3b8">对话 / 思考流</text>
    <!-- Line 2: Green -->
    <line x1="126" y1="17" x2="146" y2="17" stroke="#34d399" stroke-width="2.5"/>
    <text x="154" y="21" font-size="11" fill="#94a3b8">反向工具调用</text>
    <!-- Line 3: Amber -->
    <circle cx="242" cy="17" r="4" fill="#fbbf24"/>
    <text x="252" y="21" font-size="11" fill="#94a3b8">安全鉴权</text>
  </g>

  <!-- ======================================================== -->
  <!-- ZONE 1: LOCAL MAC (DSH Core)                             -->
  <!-- ======================================================== -->
  <g transform="translate(60, 110)">
    <rect width="360" height="660" rx="16" fill="url(#localCardGrad)" stroke="#1e3a5f" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Zone Header -->
    <rect width="360" height="52" rx="16" fill="#0c1e38"/>
    <rect y="36" width="360" height="16" fill="#0c1e38"/>
    <circle cx="26" cy="26" r="6" fill="#0284c7"/>
    <text x="42" y="31" font-size="15" font-weight="700" fill="#e0f2fe">本地 Mac 宿主机 (Local DSH)</text>
    <rect x="270" y="15" width="74" height="22" rx="11" fill="#0369a1" fill-opacity="0.3"/>
    <text x="283" y="30" font-size="11" font-weight="600" fill="#38bdf8">MacOS</text>

    <!-- Sub-Module 1: DSH Web & Orchestrator -->
    <g transform="translate(20, 70)">
      <rect width="320" height="106" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#0369a1"/>
      <text x="21" y="33" font-size="14" fill="#ffffff">🖥️</text>
      <text x="50" y="28" font-size="13" font-weight="700" fill="#f8fafc">DSH Web UI &amp; Agent 引擎</text>
      <text x="50" y="44" font-size="11" fill="#64748b">会话多轮状态机 • 消息队列 • 智能体协同</text>
      <path d="M 14 60 L 306 60" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="78" font-size="11" fill="#94a3b8">• 渲染实时思考流 (Thought) 与打字机流</text>
      <text x="16" y="94" font-size="11" fill="#94a3b8">• 管理工作区上下文及工具审批安全规则</text>
    </g>

    <!-- Sub-Module 2: antigravity-acp Plugin -->
    <g transform="translate(20, 192)">
      <rect width="320" height="154" rx="10" fill="#0c192e" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#0284c7"/>
      <text x="21" y="33" font-size="14" fill="#ffffff">⚡</text>
      <text x="50" y="28" font-size="13" font-weight="700" fill="#38bdf8">antigravity-acp (适配器插件)</text>
      <text x="50" y="44" font-size="11" fill="#38bdf8" fill-opacity="0.8">Plugin ID: @local/dsh-antigravity-acp v1.4.1</text>
      
      <rect x="14" y="60" width="292" height="40" rx="6" fill="#081426" stroke="#1e3a5f" stroke-width="1"/>
      <text x="24" y="76" font-size="11" font-weight="600" fill="#7dd3fc">协议转换内核 (ACP Driver)</text>
      <text x="24" y="91" font-size="10" fill="#64748b">DSH 消息 ⇄ session/prompt • 思考/正文流式分流</text>

      <rect x="14" y="106" width="292" height="36" rx="6" fill="#081426" stroke="#1e3a5f" stroke-width="1"/>
      <text x="24" y="122" font-size="11" font-weight="600" fill="#7dd3fc">挂起与恢复引擎 (Call Park / Resume)</text>
      <text x="24" y="135" font-size="10" fill="#64748b">工具调用异步挂起，等 DSH 结果回填解挂</text>
    </g>

    <!-- Sub-Module 3: Loopback MCP Bridge -->
    <g transform="translate(20, 362)">
      <rect width="320" height="120" rx="10" fill="#061c24" stroke="#059669" stroke-width="1.2"/>
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#059669"/>
      <text x="21" y="33" font-size="14" fill="#ffffff">🔗</text>
      <text x="50" y="28" font-size="13" font-weight="700" fill="#34d399">本地反向 MCP HTTP Server</text>
      <text x="50" y="44" font-size="11" fill="#059669">http://127.0.0.1:&lt;port&gt;/mcp/{tenant}</text>
      
      <text x="16" y="74" font-size="11" fill="#94a3b8">• 隔离鉴权：Bearer Token + 随机安全密钥</text>
      <text x="16" y="92" font-size="11" fill="#94a3b8">• 工具透传：暴露 DSH 工具为 mcp_dsh_*</text>
      <text x="16" y="110" font-size="11" fill="#94a3b8">• 支持多会话同时并发与精准路由分发</text>
    </g>

    <!-- Sub-Module 4: Local Execution Environment -->
    <g transform="translate(20, 498)">
      <rect width="320" height="142" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="26" font-size="12" font-weight="700" fill="#cbd5e1">本地实际工作区 (Local Workspace)</text>
      <text x="16" y="42" font-size="11" fill="#64748b">&lt;workspace&gt;</text>
      
      <!-- Tool Badges -->
      <g transform="translate(14, 56)">
        <rect x="0" y="0" width="64" height="24" rx="4" fill="#1e293b"/>
        <text x="14" y="16" font-size="10" font-weight="600" fill="#38bdf8">read/edit</text>

        <rect x="72" y="0" width="58" height="24" rx="4" fill="#1e293b"/>
        <text x="82" y="16" font-size="10" font-weight="600" fill="#38bdf8">write</text>

        <rect x="138" y="0" width="54" height="24" rx="4" fill="#1e293b"/>
        <text x="148" y="16" font-size="10" font-weight="600" fill="#38bdf8">bash</text>

        <rect x="200" y="0" width="88" height="24" rx="4" fill="#1e293b"/>
        <text x="210" y="16" font-size="10" font-weight="600" fill="#38bdf8">glob / grep</text>
      </g>
      <text x="16" y="104" font-size="11" fill="#10b981">✔ 代码读写与命令全部在 Mac 本地安全执行</text>
      <text x="16" y="122" font-size="11" fill="#10b981">✔ 绝对保护本地代码资产与网络隔离性</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- ZONE 2: SECURE SSH TUNNEL                                -->
  <!-- ======================================================== -->
  <g transform="translate(450, 110)">
    <rect width="280" height="660" rx="16" fill="url(#tunnelGrad)" stroke="#4338ca" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Zone Header -->
    <rect width="280" height="52" rx="16" fill="#1e1b4b"/>
    <rect y="36" width="280" height="16" fill="#1e1b4b"/>
    <circle cx="26" cy="26" r="6" fill="#818cf8"/>
    <text x="42" y="31" font-size="15" font-weight="700" fill="#e0e7ff">SSH 双向加密隧道</text>

    <!-- Tunnel Details Card -->
    <g transform="translate(18, 70)">
      <rect width="244" height="90" rx="8" fill="#13112c" stroke="#312e81" stroke-width="1"/>
      <text x="14" y="24" font-size="11" font-weight="700" fill="#a5b4fc">SSH 链路参数</text>
      <text x="14" y="42" font-size="10" fill="#6366f1">Target: user@host</text>
      <text x="14" y="58" font-size="10" fill="#6366f1">Auth: SSH key, configured outside this repo</text>
      <text x="14" y="74" font-size="10" fill="#6366f1">Keepalive: ServerAliveInterval=15</text>
    </g>

    <!-- Channel A: Forward Stdio -->
    <g transform="translate(18, 180)">
      <rect width="244" height="160" rx="10" fill="#17153b" stroke="#6366f1" stroke-width="1"/>
      <text x="14" y="24" font-size="12" font-weight="700" fill="#c7d2fe">通道一：Stdio 管道流</text>
      <text x="14" y="42" font-size="10" fill="#818cf8">JSON-RPC over SSH stdin / stdout</text>
      
      <rect x="12" y="56" width="220" height="42" rx="6" fill="#0d0b21"/>
      <text x="20" y="74" font-size="10" font-weight="600" fill="#38bdf8">▶ 下发: session/prompt</text>
      <text x="20" y="88" font-size="9" fill="#64748b">包含消息序列、模型配置、MCP 服务列表</text>

      <rect x="12" y="104" width="220" height="42" rx="6" fill="#0d0b21"/>
      <text x="20" y="122" font-size="10" font-weight="600" fill="#38bdf8">◀ 上行: session/update (流式)</text>
      <text x="20" y="136" font-size="9" fill="#64748b">思考链块、正文 Chunk、用量 Usage 统计</text>
    </g>

    <!-- Channel B: Reverse MCP Port -->
    <g transform="translate(18, 360)">
      <rect width="244" height="150" rx="10" fill="#132421" stroke="#059669" stroke-width="1.2"/>
      <text x="14" y="24" font-size="12" font-weight="700" fill="#6ee7b7">通道二：反向端口转发</text>
      <text x="14" y="42" font-size="10" fill="#34d399">-R 127.0.0.1:&lt;port&gt;:&lt;port&gt;</text>
      
      <rect x="12" y="56" width="220" height="78" rx="6" fill="#091414"/>
      <text x="20" y="76" font-size="10" font-weight="600" fill="#34d399">◀ 远端访问本地 MCP</text>
      <text x="20" y="92" font-size="9" fill="#94a3b8">远端 agy 调用工具时，请求发至 VPS 的</text>
      <text x="20" y="106" font-size="9" fill="#94a3b8">loopback port, forwarded back to the local MCP bridge</text>
      <text x="20" y="120" font-size="9" fill="#94a3b8">本地 Mac 上的 MCP 服务！</text>
    </g>

    <!-- Status pill -->
    <g transform="translate(48, 540)">
      <rect width="184" height="34" rx="17" fill="#0c0a24" stroke="#4f46e5" stroke-width="1"/>
      <circle cx="20" cy="17" r="5" fill="#22c55e" filter="url(#glow-cyan)"/>
      <text x="34" y="21" font-size="11" font-weight="600" fill="#c7d2fe">反向反查通道 运行中</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- ZONE 3: THAILAND HOST & GOOGLE API                       -->
  <!-- ======================================================== -->
  <g transform="translate(760, 110)">
    <rect width="460" height="660" rx="16" fill="url(#vpsGrad)" stroke="#047857" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Zone Header -->
    <rect width="460" height="52" rx="16" fill="#064e3b"/>
    <rect y="36" width="460" height="16" fill="#064e3b"/>
    <circle cx="26" cy="26" r="6" fill="#10b981"/>
    <text x="42" y="31" font-size="15" font-weight="700" fill="#ecfdf5">Remote host (official client gateway)</text>
    <rect x="360" y="15" width="84" height="22" rx="11" fill="#047857" fill-opacity="0.4"/>
    <text x="372" y="30" font-size="11" font-weight="600" fill="#6ee7b7">remote</text>

    <!-- VPS Core Process -->
    <g transform="translate(20, 70)">
      <rect width="420" height="180" rx="10" fill="#022019" stroke="#059669" stroke-width="1.5"/>
      <rect x="16" y="14" width="28" height="28" rx="6" fill="#059669"/>
      <text x="23" y="33" font-size="14" fill="#ffffff">🤖</text>
      <text x="54" y="28" font-size="14" font-weight="700" fill="#a7f3d0">Google Antigravity CLI (agy)</text>
      <text x="54" y="44" font-size="11" fill="#34d399">Binary: ~/.local/bin/agy v1.5.3</text>

      <rect x="16" y="60" width="388" height="36" rx="6" fill="#031510" stroke="#047857" stroke-width="1"/>
      <text x="26" y="78" font-size="10" font-family="monospace" font-weight="700" fill="#34d399">exec agy acp --dangerously-skip-permissions</text>
      <text x="26" y="90" font-size="9" fill="#6ee7b7">启动参数直通：跳过交互式二次审批，保证全自主工具调用</text>

      <!-- Key Capabilities -->
      <g transform="translate(16, 108)">
        <text x="0" y="16" font-size="11" fill="#cbd5e1">• 原生 ACP 服务端：完整实现 Google Agent 协议栈</text>
        <text x="0" y="34" font-size="11" fill="#cbd5e1">• Credentials stay in the official client on the remote host</text>
        <text x="0" y="52" font-size="11" fill="#cbd5e1">• 动态加载反向 MCP：透明挂载 Mac 宿主机的本地工具</text>
      </g>
    </g>

    <!-- Connection to Google API Banner -->
    <g transform="translate(20, 268)">
      <line x1="210" y1="0" x2="210" y2="24" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3"/>
      <text x="220" y="15" font-size="10" fill="#34d399">SSH between this machine and the remote host</text>
    </g>

    <!-- Google Cloud Infrastructure -->
    <g transform="translate(20, 298)">
      <rect width="420" height="336" rx="12" fill="url(#googleGrad)" stroke="#3b82f6" stroke-width="1.5"/>
      
      <!-- Sub-header -->
      <rect width="420" height="42" rx="12" fill="#1e293b"/>
      <rect y="30" width="420" height="12" fill="#1e293b"/>
      <circle cx="24" cy="21" r="6" fill="#3b82f6"/>
      <text x="38" y="26" font-size="13" font-weight="700" fill="#ffffff">Google CloudCode 服务集群</text>
      <text x="404" y="26" font-size="9" fill="#93c5fd" text-anchor="end">daily-cloudcode-pa.googleapis.com</text>

      <!-- Model Badge -->
      <g transform="translate(20, 56)">
        <rect width="380" height="96" rx="8" fill="#0f172a" stroke="#2563eb" stroke-width="1.2"/>
        <text x="16" y="28" font-size="16" font-weight="800" fill="#60a5fa">Gemini 3.8 Flash (Google AI Pro)</text>
        <text x="16" y="46" font-size="11" fill="#94a3b8">官方顶级性能模型 • 多模态原生理解 • 超长上下文架构</text>
        
        <rect x="16" y="58" width="105" height="24" rx="4" fill="#1e293b"/>
        <text x="24" y="74" font-size="10" font-weight="600" fill="#38bdf8">Thinking 流式推理</text>

        <rect x="129" y="58" width="100" height="24" rx="4" fill="#1e293b"/>
        <text x="137" y="74" font-size="10" font-weight="600" fill="#38bdf8">原生工具决策调用</text>

        <rect x="237" y="58" width="125" height="24" rx="4" fill="#1e293b"/>
        <text x="245" y="74" font-size="10" font-weight="600" fill="#38bdf8">视觉 / 代码精准分析</text>
      </g>

      <!-- Why it's undetectable -->
      <g transform="translate(20, 168)">
        <rect width="380" height="146" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
        <text x="16" y="24" font-size="11" font-weight="700" fill="#f8fafc">官方合规防封屏障 (Why it is 100% Native):</text>
        <text x="16" y="46" font-size="11" fill="#cbd5e1">1. 身份合规：客户端特征、TLS 指纹与包结构完全匹配官方 CLI</text>
        <text x="16" y="68" font-size="11" fill="#cbd5e1">2. 协议合规：标准 Google CloudCode gRPC/REST 官方协议握手</text>
        <text x="16" y="90" font-size="11" fill="#cbd5e1">3. The remote host runs the official client; this repo does not name that host</text>
        <text x="16" y="112" font-size="11" fill="#cbd5e1">4. 额度联动：直接计入用户官方 AI Pro 配额，无封号截流风险</text>
      </g>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- CONNECTING ARROWS & FLOW ANNOTATIONS                     -->
  <!-- ======================================================== -->
  <!-- Forward Prompt Line (Local -> Tunnel -> Remote) -->
  <path d="M 420 280 L 468 280" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 712 280 L 780 280" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Return Stream Line (Remote -> Tunnel -> Local) -->
  <path d="M 780 320 L 712 320" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrow-blue)"/>
  <path d="M 468 320 L 420 320" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrow-blue)"/>

  <!-- Reverse Tool Call Line (Remote agy -> Tunnel -> Local MCP) -->
  <path d="M 780 440 L 712 440" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 468 440 L 420 440" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- Tool Result Return Line (Local MCP -> Tunnel -> Remote agy) -->
  <path d="M 420 470 L 468 470" stroke="#34d399" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arrow-green)"/>
  <path d="M 712 470 L 780 470" stroke="#34d399" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arrow-green)"/>

  <!-- Floating badges for connectors -->
  <g transform="translate(414, 258)">
    <rect width="60" height="18" rx="4" fill="#0284c7"/>
    <text x="6" y="13" font-size="9" font-weight="700" fill="#ffffff">Prompt ▶</text>
  </g>

  <g transform="translate(414, 328)">
    <rect width="60" height="18" rx="4" fill="#0369a1"/>
    <text x="7" y="13" font-size="9" font-weight="700" fill="#ffffff">◀ Stream</text>
  </g>

  <g transform="translate(414, 428)">
    <rect width="62" height="18" rx="4" fill="#059669"/>
    <text x="6" y="13" font-size="9" font-weight="700" fill="#ffffff">◀ ToolCall</text>
  </g>

  <g transform="translate(414, 478)">
    <rect width="62" height="18" rx="4" fill="#047857"/>
    <text x="6" y="13" font-size="9" font-weight="700" fill="#ffffff">Result ▶</text>
  </g>
</svg>
